name: "Setup"
description: "Setup kUPS environment"
inputs:
  jax-cache-key:
    description: "Restore the newest JAX compilation cache saved under this key (empty: one cache per uv.lock)"
    default: ""
outputs:
  jax-cache-key:
    description: "Key under which to save this commit's JAX compilation cache"
    value: ${{ steps.jax-cache-restore.outputs.cache-primary-key }}
runs:
  using: "composite"
  steps:
    - if: inputs.jax-cache-key == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/jax_cache
        key: ${{ runner.os }}-${{ github.job }}-jax-${{ hashFiles('**/uv.lock') }}
    - id: jax-cache-restore
      if: inputs.jax-cache-key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/jax_cache
        key: ${{ runner.os }}-${{ github.job }}-${{ inputs.jax-cache-key }}-jax-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ github.job }}-${{ inputs.jax-cache-key }}-jax-
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        prune-cache: false
