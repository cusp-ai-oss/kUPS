inp_files:
  - ../host/argon_fcc.cif

run:
  out_file: ../../md_nve_lj_argon.h5
  num_warmup_steps: 5_000
  num_steps: 5_000
  seed: 42

md:
  temperature: "100.0 K"
  time_step: "0.1 fs"
  friction_coefficient: "0.0 1/fs"
  thermostat_time_constant: "1.0e10 fs"
  target_pressure: "1.0 Pa"
  pressure_coupling_time: "1.0e10 fs"
  compressibility: "4.5e-5 1/Pa"
  minimum_scale_factor: 1.0
  integrator: verlet

potential:
  backend: lj
  cutoff: "10.0 angstrom"
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: ["3.405 angstrom", "0.01032356174398622 eV"]
