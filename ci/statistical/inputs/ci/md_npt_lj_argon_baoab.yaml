inp_files:
  - ../host/argon_fcc.cif

run:
  out_file: ../../md_npt_lj_argon_baoab.h5
  num_warmup_steps: 5_000
  num_steps: 5_000
  seed: 42

md:
  temperature: "100.0 K"
  time_step: "2.0 fs"
  # Gao Eq. (14) auto-derives the cell mass tensor from compressibility +
  # pressure_coupling_time; friction_coefficient drives both atom and cell
  # Langevin friction (Gao Remark 3 default).
  friction_coefficient: "0.01 1/fs"
  thermostat_time_constant: "100.0 fs"
  # Total pressure at NVT equilibrium density: P_kin + P_config ≈ 420 bar
  target_pressure: "42000000.0 Pa"
  pressure_coupling_time: "1000.0 fs"
  # Liquid argon kappa_T at 100K (NIST, Tegeler et al. 1999, DOI: 10.1063/1.556037)
  compressibility: "5.4e-10 1/Pa"
  minimum_scale_factor: 0.9
  integrator: baoab_npt_langevin
  initialize_momenta: true

potential:
  backend: lj
  cutoff: "10.0 angstrom"
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: ["3.405 angstrom", "0.01032356174398622 eV"]
