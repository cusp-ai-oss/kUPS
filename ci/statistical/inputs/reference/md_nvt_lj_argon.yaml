inp_files:
  - ../host/argon_fcc.cif

run:
  out_file: ../../md_nvt_lj_argon_ref.h5
  num_warmup_steps: 10_000
  num_steps: 20_000
  seed: 42

md:
  temperature: "100.0 K"
  time_step: "2.0 fs"
  friction_coefficient: "0.01 1/fs"
  thermostat_time_constant: "100.0 fs"
  target_pressure: "1.0 Pa"
  pressure_coupling_time: "1.0e10 fs"
  compressibility: "4.5e-5 1/Pa"
  minimum_scale_factor: 1.0
  integrator: baoab_langevin
  initialize_momenta: true

potential:
  backend: lj
  cutoff: "10.0 angstrom"
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: ["3.405 angstrom", "0.01032356174398622 eV"]
