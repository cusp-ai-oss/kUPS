repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff # Run the linter.
        args: [--fix]
      - id: ruff # Sort imports
        name: sort imports with ruff
        args: [--select, I, --fix]
      - id: ruff-format # Run the formatter.

  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888  # v1.52.2
    hooks:
      - id: typos
        types_or: [python, markdown]
        args: [--force-exclude]

  - repo: local # Run pyright type checker
    hooks:
      - id: uv-lock-check
        name: check uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check src/
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false

      - id: kups-lint
        name: kUPS-specific checks
        entry: uv run python ci/kups_lint.py src
        language: system
        types: [python]
        files: ^(src/|ci/kups_lint)
        pass_filenames: false

      - id: clear-notebook-output
        name: clear notebook output
        entry: uv run jupyter nbconvert --clear-output --inplace
        language: system
        files: ^docs/notebooks/.*\.ipynb$
        types: [jupyter]
