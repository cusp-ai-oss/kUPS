# Shared TIP4P/2005 setup. Run with one of the ensemble files:
#   kups_md_rigid md_water_tip4p_common.yaml md_water_tip4p_nvt.yaml
# All defaults below are sensible for liquid water at 298 K, 1 bar density.
adsorbates:
  - !import ["adsorbate/h2o.yaml"]

n_molecules: [256]

box:
  edge_length: 19.74          # Å, 256 waters at ρ ≈ 0.997 g/cm³

lj: !import ["lennard_jones/tip4p_2005.yaml"]

ewald:
  real_cutoff: 9.0
  precision: 1.0e-5

md:
  temperature: 298.0
  time_step: 1.0
  friction_coefficient: 0.01
  thermostat_time_constant: 100.0
  target_pressure: 1.01325e5     # Pa (1 atm)
  pressure_coupling_time: 1000.0
  compressibility: 4.5e-10
  minimum_scale_factor: 0.5
  integrator: rigid_csvr
  initialize_momenta: true

run:
  num_warmup_steps: 0
  seed: 42
