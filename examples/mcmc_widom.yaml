# Widom test-particle insertion: RUBTAK Zr-MOF + CO2 at 1 bar / 298 K.
#
# Host force field: UFF4MOF / UFF4MOF-II (lennard_jones/uff4mof.yaml).
# `atom_type_map:` rewrites the bare-element labels in RUBTAK.cif to
# UFF4MOF type names at host load.
#
# Vanilla-UFF fallback: swap `lj:` to `trappe.yaml` and drop `atom_type_map:`;
# the bare CIF labels match `trappe.yaml`'s bare-element entries directly.
adsorbates:
  - !import ["adsorbate/co2.yaml"]

hosts:
  - cif_file: host/RUBTAK.cif
    pressure: 100_000   # Pa (1 bar)
    temperature: 298.15   # K
    init_adsorbates: [0]
    cell_replication: 3
    atom_type_map:
      Zr: Zr8f4   # 8-fold-coordinated Zr in the Zr6O8 SBU (UFF4MOF-II)
      C:  C_R     # aromatic linker C (UFF Rappé)
      O:  O_R     # carboxylate / bridging O (UFF Rappé)
      H:  H_      # benzene H (UFF Rappé)
    # ── Optional blocking spheres (per adsorbate species) ──
    # blocking_spheres:
    #   - - center: [0.0, 0.0, 0.0]
    #       radius: 2.5

lj: !import ["lennard_jones/uff4mof.yaml"]
# lj: !import ["lennard_jones/trappe.yaml"]   # vanilla-UFF fallback

ewald:
  real_cutoff: 12.0
  precision: 1.e-6

run:
  num_cycles: 500
  num_warmup_cycles: 100
  num_displacements_per_cycle: 20
  num_widom_per_cycle: 10
  translation_prob: 0.333
  rotation_prob: 0.333
  reinsertion_prob: 0.333
  seed: 42

max_num_adsorbates: 200
