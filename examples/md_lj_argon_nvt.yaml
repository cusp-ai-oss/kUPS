# NVT Molecular Dynamics for Lennard-Jones Argon fluid
# BAOAB Langevin thermostat for canonical ensemble sampling

run:
  out_file: md_nvt_lj_argon.h5
  num_steps: 20_000
  num_warmup_steps: 20_000
  seed: 42

md:
  temperature: "100.0 K"
  time_step: "2.0 fs"
  friction_coefficient: "1.0 1/fs"
  thermostat_time_constant: "100.0 fs"
  target_pressure: "1.0 Pa"
  pressure_coupling_time: "1.0e10 fs"   # Disabled (NVT, not NPT)
  compressibility: "4.5e-5 1/Pa"
  minimum_scale_factor: 1.0
  integrator: "baoab_langevin"
  initialize_momenta: true

potential:
  backend: lj
  cutoff: "10.0 angstrom"
  parameters:
    Ar: ["3.405 angstrom", "0.010326 eV"]   # epsilon/k_B = 119.8 K
  mixing_rule: "lorentz_berthelot"

inp_files:
  - host/argon_fcc.cif
