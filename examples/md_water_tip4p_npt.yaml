# Rigid-body NPT MD for TIP4P/2005 at 298 K, 1 atm.
# Density should converge near 0.997 g/cm³ (with LJ tail correction enabled;
# without it expect ~0.983 g/cm³ at 9 Å cutoff). Use with md_water_tip4p_common.yaml.
md:
  integrator: rigid_csvr_npt

run:
  out_file: md_water_tip4p_npt.h5
  num_steps: 200_000
  num_warmup_steps: 50_000
